<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>E-Commerce App</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f4f4;
}

.header {
    background: #333;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    width: 80%;
    margin: auto;
}

.section {
    background: white;
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
}

input {
    padding: 8px;
    margin: 5px;
}

button {
    padding: 8px 12px;
    margin: 5px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.product, .cart-item {
    display: flex;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

.pay-box {
    display: inline-block;
    padding: 10px;
    margin: 5px;
    border: 1px solid gray;
    cursor: pointer;
    border-radius: 5px;
}

.selected {
    border: 2px solid green;
}

#paymentModal {
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-box {
    background:white;
    padding:20px;
    width:300px;
    border-radius:10px;
    text-align:center;
}
</style>
</head>

<body>

<div class="header">
<h1>E-Commerce App</h1>
</div>

<div class="container">

<!-- REGISTER -->
<div class="section">
<h3>Register</h3>
<input id="rname" placeholder="Name">
<input id="remail" placeholder="Email">
<input id="rpassword" placeholder="Password">
<button onclick="register()">Register</button>
</div>

<!-- LOGIN -->
<div class="section">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- PRODUCTS -->
<div class="section">
<h3>Products</h3>
<div id="productList"></div>
</div>

<!-- CART -->
<div class="section">
<h3>Cart</h3>
<button onclick="viewCart()">Refresh Cart</button>
<div id="cartList"></div>
</div>

<!-- PAYMENT -->
<div class="section">
<h3>Payment</h3>

<div class="pay-box" onclick="selectMethod(event,'GPay')">GPay</div>
<div class="pay-box" onclick="selectMethod(event,'Paytm')">Paytm</div>
<div class="pay-box" onclick="selectMethod(event,'UPI')">UPI</div>
<div class="pay-box" onclick="selectMethod(event,'COD')">COD</div>

<br><br>
<button onclick="pay()">Pay Now</button>

<p id="result"></p>
</div>

</div>

<!-- PAYMENT MODAL -->
<div id="paymentModal">
<div class="modal-box">

<h3>UPI Payment</h3>
<p id="payAmount"></p>

<div id="step1">
<input id="upiInput" placeholder="Enter UPI ID"><br><br>
<button onclick="nextStep()">Next</button>
</div>

<div id="step2" style="display:none;">
<p>Enter UPI PIN</p>
<input type="password" id="pin"><br><br>
<button onclick="processPayment()">Pay</button>
</div>

<div id="step3" style="display:none;">
<p>⏳ Processing...</p>
</div>

<div id="step4" style="display:none;">
<h3 style="color:green;">✅ Payment Successful</h3>
<button onclick="closeModal()">Close</button>
</div>

</div>
</div>

<script>

let totalAmount = 0;
let selectedMethod = "";
let selectedUserId = 1; // change after login

// REGISTER
function register() {
fetch("/auth/register", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:rname.value,
email:remail.value,
password:rpassword.value
})
})
.then(res=>res.text())
.then(msg=>alert(msg))
.catch(()=>alert("Error"));
}

// LOGIN
function login() {
fetch("/auth/login", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value,
password:password.value
})
})
.then(res=>res.text())
.then(data=>alert(data))
.catch(()=>alert("Login failed"));
}

// LOAD PRODUCTS
function loadProducts() {
fetch("/products")
.then(res=>res.json())
.then(data=>{
let out="";
data.forEach(p=>{
out+=`
<div class="product">
<span>${p.name} - ₹${p.price}</span>
<button onclick="addToCart(${p.id})">Add</button>
</div>`;
});
document.getElementById("productList").innerHTML=out;
})
.catch(()=>alert("Failed to load products"));
}

// ADD TO CART (FIXED)
function addToCart(productId){
fetch(`/cart/add?userId=${selectedUserId}&productId=${productId}`, {
method:"POST"
})
.then(res=>res.text())
.then(msg=>{
alert("Added to cart");
viewCart();
})
.catch(()=>alert("Add to cart failed"));
}

// VIEW CART (FIXED)
function viewCart() {
fetch(`/cart/${selectedUserId}`)
.then(res=>res.json())
.then(data=>{
let out="";
totalAmount=0;

data.forEach(item=>{
out+=`
<div class="cart-item">
<span>${item.product.name} x ${item.quantity}</span>
</div>`;

totalAmount += item.product.price * item.quantity;
});

out += `<h4>Total: ₹${totalAmount}</h4>`;
document.getElementById("cartList").innerHTML = out;
})
.catch(()=>alert("Cart error"));
}

// SELECT PAYMENT
function selectMethod(e,method){
selectedMethod=method;
document.querySelectorAll(".pay-box").forEach(b=>b.classList.remove("selected"));
e.currentTarget.classList.add("selected");
}

// PAY
function pay(){
if(!selectedMethod){
alert("Select payment method");
return;
}
document.getElementById("paymentModal").style.display="flex";
document.getElementById("payAmount").innerText="Pay ₹"+totalAmount;
}

// NEXT STEP
function nextStep(){
document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";
}

// PROCESS PAYMENT
function processPayment(){

document.getElementById("step2").style.display="none";
document.getElementById("step3").style.display="block";

setTimeout(()=>{

document.getElementById("step3").style.display="none";
document.getElementById("step4").style.display="block";

fetch("/payments", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
orderId:1,
amount:totalAmount,
method:selectedMethod,
upiId:document.getElementById("upiInput").value
})
});

},2000);
}

// CLOSE MODAL
function closeModal(){
document.getElementById("paymentModal").style.display="none";
document.getElementById("result").innerText="Order Confirmed via "+selectedMethod;
}

// INIT
window.onload = loadProducts;

</script>

</body>
</html>
